<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-box">
        <h2>Enter Password 💌</h2>
        <input type="password" id="password" placeholder="Your secret...">
        <button onclick="checkPassword()">Enter</button>
        <p id="error"></p>
    </div>
</div>

<!-- MAIN -->
<div id="mainContent">

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <h1 id="typing"></h1>

    <div class="photos">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
    </div>

    <button class="loveBtn" onclick="showLove()">Open My Heart 💖</button>

    <div id="loveBox">
        <p id="loveText"></p>
    </div>

</div>

</div>

<script>
function checkPassword(){
    let pass = document.getElementById("password").value;

    if(pass === "kanikunnati"){
        document.getElementById("login").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("music").play();
        typeHeading();
    } else {
        document.getElementById("error").innerText = "Wrong password 💔";
    }
}

// Heading typing
let heading = "For My Love ❤️";
let h = 0;

function typeHeading(){
    function typing(){
        if(h < heading.length){
            document.getElementById("typing").innerHTML += heading.charAt(h);
            h++;
            setTimeout(typing, 80);
        }
    }
    typing();
}

// Love message typing
function showLove(){
    let text = "You are my happiness ❤️\nEvery moment with you is special ✨\nI love you forever 💕";
    let i = 0;
    document.getElementById("loveBox").style.display = "block";

    function type(){
        if(i < text.length){
            document.getElementById("loveText").innerHTML += text.charAt(i);
            i++;
            setTimeout(type, 40);
        }
    }
    type();
}

// Floating hearts
setInterval(()=>{
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random()*100 + "vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
},300);
</script>

</body>
</html>
